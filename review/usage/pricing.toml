# Seneca's pricing table: USD per million tokens, standard tier.
#
# Seeded from docs/product/ai-costs.md. Every row carries the date its rates
# were last checked against the source page and that page's URL; `seneca
# doctor` warns once the oldest `verified` date is more than 45 days old.
#
# A row in ~/.config/seneca/pricing.toml with the same provider and model
# replaces the row here whole; a row with a new provider and model is added.
#
# Rates: input is uncached input, cache_write_5m and cache_write_1h the
# 5-minute and 1-hour prompt-cache writes, batch_discount the fraction the
# Batch API takes off. above_input_tokens, when set, is the prompt size past
# which above_input and above_output apply to the whole request.

[[price]]
provider = "anthropic"
model = "claude-opus-5-5"
input = 4.00
output = 20.00
cache_read = 0.20
cache_write_5m = 5.00
cache_write_1h = 8.00
batch_discount = 0.5
verified = 2026-10-14
source = "https://platform.claude.com/docs/en/about-claude/pricing"

