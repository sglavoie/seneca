# OpenAI caches automatically and does not charge for the write.
[[price]]
provider = "openai"
model = "gpt-6-astra"
input = 10.00
output = 50.00
cache_read = 1.00
batch_discount = 0.5
above_input_tokens = 272000
above_input = 20.00
above_output = 75.00
verified = 2026-10-14
source = "https://developers.openai.com/api/docs/pricing"

